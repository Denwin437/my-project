[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-organizer"
version = "1.0.0"
description = "Sort files into type or date folders, with dry-run and undo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
file-organizer = "file_organizer.cli:main"

[tool.setuptools]
packages = ["file_organizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
